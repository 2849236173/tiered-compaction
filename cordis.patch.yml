# 插件挂载声明（package.json 的 dsh.bundle.patch 指向本文件）。
#
# 装完即生效：本 patch 一次做两件事——
#   ① 停用 @deepseek-ai/dsh-compaction-basic，让出 compaction 服务位；
#   ② 插入 tiered-compaction 并直接启用。
#
# 为什么必须停用 basic：compaction 是隔离组，组内 ctx.compaction 只能有一个实现。
# 两个同时启用时，后来的那个命中服务位冲突并降级为旁路模式——
# 表现为「装了但没生效」，且界面不报错。
#
# patch 语义（宿主 dsh-app-boot/lib/index.js:61-110 `applyEntryPatches`）：
#   - 顶层只有 insert → 新增条目，id/config 放在 insert 数组项内；
#   - 顶层带 id + 字段 → 修改已存在条目，未列出的字段保持原值；
#   - 找不到 id 时该条被跳过并告警，不影响其它条目。
#
# 回退到官方压缩：把下面两处的开关互换——
#   compaction-basic 的 disabled 改为 false，
#   tiered-compaction 的 enabled 改为 false。

# ── ① 停用官方 basic，让出 compaction 服务位 ──
- id: compaction-basic
  disabled: true

# ── ② 插入并启用本插件 ──
- insert:
    - id: tiered-compaction
      name: "dsh-tiered-compaction"
      config:
        enabled: true
        # archiveDir 不填则用宿主默认目录（~/.dsh/tiered-archive）。
        # 要自定义就取消注释并改成你的绝对路径。
        # archiveDir: /absolute/path/to/archive
